<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Auto-Gallery (Dynamic)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #ffffff; font-family: sans-serif; touch-action: none; }
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.9); padding: 30px; border-radius: 15px;
            text-align: center; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 80%; max-width: 300px;
        }
        #joystick-wrapper {
            position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px;
            background: rgba(0,0,0,0.05); border-radius: 50%; display: none; z-index: 20; border: 1px solid #ddd;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: #333; border-radius: 50%;
        }
        #loading-status { font-size: 12px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="instructions">
        <h2>Gallery</h2>
        <p id="status-text">Scanning for photos...</p>
        <button id="start-btn" style="display:none; padding: 12px 24px; background: #000; color: #fff; border: none; border-radius: 5px; cursor: pointer;">ENTER</button>
        <div id="loading-status"></div>
    </div>
    <div id="joystick-wrapper"><div id="joystick-knob"></div></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 1. SETTINGS & GITHUB CONFIG ---
        const GITHUB_USERNAME = 'komurugov';
        const REPO_NAME = 'AG';
        const MOVE_SPEED = 0.06; 
        const WALL_HEIGHT = 5;
        const OFFSET = 16.98;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        scene.fog = new THREE.Fog(0xffffff, 0, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, -14.5); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));

        const loader = new THREE.TextureLoader();

        // --- 2. THE DYNAMIC SCANNER ---
        async function scanForImages() {
            const statusText = document.getElementById('status-text');
            const startBtn = document.getElementById('start-btn');
            
            try {
                // Fetch file list from GitHub API
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/`);
                const files = await response.json();
                
                // Filter for images
                const images = files
                    .filter(file => file.name.match(/\.(jpg|jpeg|png|webp)$/i))
                    .map(file => file.name);

                if (images.length === 0) {
                    statusText.innerText = "No photos found in the folder.";
                } else {
                    statusText.innerText = `Found ${images.length} photos.`;
                    startBtn.style.display = 'inline-block';
                    setupGallery(images);
                }
            } catch (error) {
                console.error("GitHub API Error:", error);
                statusText.innerText = "Error loading photo list.";
            }
        }

        function setupGallery(imageFiles) {
            imageFiles.forEach((file, i) => {
                let x = 0, z = 0, rot = 0;
                const spacing = 6;
                // Distribute on walls
                if (i < 5) { x = -12 + (i * spacing); z = -OFFSET; rot = 0; } 
                else if (i < 10) { x = OFFSET; z = -12 + ((i-5) * spacing); rot = -Math.PI/2; } 
                else if (i < 15) { x = 12 - ((i-10) * spacing); z = OFFSET; rot = Math.PI; } 
                else if (i < 20) { x = -OFFSET; z = 12 - ((i-15) * spacing); rot = Math.PI/2; }
                
                placeArt(file, x, z, rot);
            });
        }

        function placeArt(file, x, z, rotationY) {
            loader.load(file, (texture) => {
                const artGeo = new THREE.PlaneGeometry(2.8, 3.8);
                const artMat = new THREE.MeshStandardMaterial({ map: texture });
                const mesh = new THREE.Mesh(artGeo, artMat);
                mesh.position.set(x, 2.3, z);
                mesh.rotation.y = rotationY;
                scene.add(mesh);

                const spot = new THREE.PointLight(0xffffff, 7, 12);
                const lx = x + (rotationY === Math.PI/2 ? 1.5 : (rotationY === -Math.PI/2 ? -1.5 : 0));
                const lz = z + (rotationY === 0 ? 1.5 : (rotationY === Math.PI ? -1.5 : 0));
                spot.position.set(lx, 3.5, lz);
                scene.add(spot);
            });
        }

        // --- 3. ENVIRONMENT & ENGINE ---
        // (Existing floor/wall/control code remains the same)
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0xfcfcfc }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);
        const grid = new THREE.GridHelper(100, 50, 0xcccccc, 0xeeeeee);
        grid.position.y = 0.02;
        scene.add(grid);

        function createWall(w, h, x, z, rot = 0) {
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            mesh.position.set(x, h/2, z); mesh.rotation.y = rot; scene.add(mesh);
        }
        createWall(40, WALL_HEIGHT, 0, -17); createWall(40, WALL_HEIGHT, 0, 17);
        createWall(40, WALL_HEIGHT, -17, 0, Math.PI/2); createWall(40, WALL_HEIGHT, 17, 0, -Math.PI/2);
        createWall(26, WALL_HEIGHT, 0, -13); createWall(26, WALL_HEIGHT, 0, 13);
        createWall(26, WALL_HEIGHT, -13, 0, Math.PI/2); createWall(26, WALL_HEIGHT, 13, 0, -Math.PI/2);

        // --- 4. CONTROLS & ANIMATION ---
        const controls = new PointerLockControls(camera, document.body);
        document.getElementById('start-btn').addEventListener('click', () => {
            if (!isMobile) controls.lock();
            document.getElementById('instructions').style.display = 'none';
            if (isMobile) document.getElementById('joystick-wrapper').style.display = 'block';
        });

        let moveState = { f: 0, r: 0 };
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveState.f = 1; if (e.code === 'KeyS') moveState.f = -1;
            if (e.code === 'KeyA') moveState.r = -1; if (e.code === 'KeyD') moveState.r = 1;
        });
        window.addEventListener('keyup', (e) => {
            if (['KeyW', 'KeyS'].includes(e.code)) moveState.f = 0;
            if (['KeyA', 'KeyD'].includes(e.code)) moveState.r = 0;
        });

        // Mobile Logic (Simplified for this snippet)
        let joystickActive = false, joystickStart = { x: 0, y: 0 };
        document.addEventListener('touchstart', (e) => { if (e.touches[0].clientX < 150) { joystickActive = true; joystickStart = { x: e.touches[0].clientX, y: e.touches[0].clientY }; } });
        document.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            if (joystickActive) {
                moveState.f = -((t.clientY - joystickStart.y) / 40);
                moveState.r = (t.clientX - joystickStart.x) / 40;
                document.getElementById('joystick-knob').style.transform = `translate(${moveState.r*20}px, ${-moveState.f*20}px)`;
            } else if (t.clientX > window.innerWidth/2) {
                if (window.lastX) camera.rotation.y -= (t.clientX - window.lastX) * 0.01;
                window.lastX = t.clientX;
            }
        });
        document.addEventListener('touchend', () => { joystickActive = false; moveState.f = 0; moveState.r = 0; window.lastX = null; document.getElementById('joystick-knob').style.transform = `translate(0,0)`; });

        function animate() {
            requestAnimationFrame(animate);
            if (moveState.f !== 0 || moveState.r !== 0) {
                const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
                const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
                const nextPos = camera.position.clone();
                nextPos.addScaledVector(dir, moveState.f * MOVE_SPEED);
                nextPos.addScaledVector(side, -moveState.r * MOVE_SPEED);
                const absX = Math.abs(nextPos.x), absZ = Math.abs(nextPos.z);
                if ((absX > 13.5 && absX < 16.5) || (absZ > 13.5 && absZ < 16.5)) { if (absX < 16.5 && absZ < 16.5) camera.position.copy(nextPos); }
            }
            renderer.render(scene, camera);
        }

        // Start the process
        scanForImages();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
