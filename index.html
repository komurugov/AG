<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Gallery - Visible Rendering</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fafafa; font-family: sans-serif; touch-action: none; }
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.98); padding: 30px; border-radius: 15px;
            text-align: center; z-index: 1000; box-shadow: 0 10px 50px rgba(0,0,0,0.2); 
            width: 85%; max-width: 320px; border: 1px solid #eee;
        }
        #status-text { font-size: 14px; color: #333; margin-bottom: 15px; }
        #start-btn { display: none; width: 100%; padding: 15px; background: #000; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #speed-ui { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.5); color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 12px; pointer-events: none; z-index: 10; display: none; }
        #joystick-wrapper { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; background: rgba(0,0,0,0.05); border-radius: 50%; display: none; z-index: 20; border: 2px solid #ddd; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: #333; border-radius: 50%; }
        #error-log { position: absolute; bottom: 10px; left: 10px; color: red; font-size: 10px; z-index: 2000; background: rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div id="error-log"></div>
    <div id="instructions">
        <h2 style="margin-top:0">Julya Art Gallery</h2>
        <p id="status-text">Scanning for photos...</p>
        <button id="start-btn">ENTER GALLERY</button>
    </div>
    <div id="speed-ui">Speed: 1.0x</div>
    <div id="joystick-wrapper"><div id="joystick-knob"></div></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- ERROR LOGGER ---
        window.onerror = (msg, url, line) => {
            document.getElementById('error-log').innerText = `Error: ${msg} [Line: ${line}]`;
        };

        // --- CONFIG ---
        const GITHUB_USERNAME = 'komurugov';
        const REPO_NAME = 'AG';
        const PHOTO_SPACING = 3.5; 
        const HALLWAY_WIDTH = 8.0;
        const INFINITE_LEN = 500;
        const BASE_MOVE_SPEED = 0.08;

        // --- GLOBALS ---
        let OUTER_LIMIT = 20, INNER_LIMIT = 12; 
        let artPieces = [];
        let moveStartTime = null, moveState = { f: 0, r: 0 };
        let isStarted = false;

        // Visibility Math Objects (Reused every frame for performance)
        const frustum = new THREE.Frustum();
        const projScreenMatrix = new THREE.Matrix4();

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfafafa);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1500);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sun = new THREE.DirectionalLight(0xffffff, 0.4);
        sun.position.set(5, 10, 7.5);
        scene.add(sun);

        const loader = new THREE.TextureLoader();
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const controls = new PointerLockControls(camera, document.body);

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- GALLERY BUILDER ---
        async function loadGallery() {
            const status = document.getElementById('status-text');
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/`);
                if (!res.ok) throw new Error("GitHub API Connection Failed");
                
                const data = await res.json();
                let images = data.filter(f => f.name.match(/\.(jpg|jpeg|png|webp)$/i)).map(f => f.name);
                if(images.length === 0) throw new Error("No images found.");

                images = shuffle(images);
                const ipw = Math.ceil(images.length / 4);
                const wallLength = Math.max(25, (ipw + 1) * PHOTO_SPACING);
                
                OUTER_LIMIT = wallLength / 2;
                INNER_LIMIT = OUTER_LIMIT - HALLWAY_WIDTH;

                const wallMat = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide });
                const buildWall = (w, x, z, r) => {
                    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, 6), wallMat);
                    m.position.set(x, 3, z); m.rotation.y = r; scene.add(m);
                };

                buildWall(wallLength, 0, -OUTER_LIMIT, 0);
                buildWall(wallLength, 0, OUTER_LIMIT, 0);
                buildWall(wallLength, -OUTER_LIMIT, 0, Math.PI/2);
                const side = (wallLength - 4) / 2;
                buildWall(side, OUTER_LIMIT, -wallLength/2 + side/2, Math.PI/2);
                buildWall(side, OUTER_LIMIT, wallLength/2 - side/2, Math.PI/2);

                const inS = Math.max(1, wallLength - (HALLWAY_WIDTH * 2));
                buildWall(inS, 6, 0, -INNER_LIMIT, 0); buildWall(inS, 6, 0, INNER_LIMIT, 0);
                buildWall(inS, 6, -INNER_LIMIT, 0, Math.PI/2); buildWall(inS, 6, INNER_LIMIT, 0, Math.PI/2);

                // Infinite Wing
                buildWall(INFINITE_LEN, 6, OUTER_LIMIT + INFINITE_LEN/2, -2, 0);
                buildWall(INFINITE_LEN, 6, OUTER_LIMIT + INFINITE_LEN/2, 2, 0);
                const f2 = new THREE.Mesh(new THREE.PlaneGeometry(INFINITE_LEN, 4), new THREE.MeshStandardMaterial({color:0xdddddd}));
                f2.rotation.x = -Math.PI/2; f2.position.set(OUTER_LIMIT + INFINITE_LEN/2, 0.01, 0); scene.add(f2);
                
                for(let j=0; j<40; j++) {
                    const x = OUTER_LIMIT + 5 + (j*12);
                    const c = new THREE.Mesh(new THREE.PlaneGeometry(2, 2.5), new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xffffff, emissiveIntensity:0.1}));
                    c.position.set(x, 2.2, -1.98); scene.add(c);
                    const c2 = c.clone(); c2.position.z = 1.98; c2.rotation.y = Math.PI; scene.add(c2);
                }

                images.forEach((file, i) => {
                    const wallIdx = Math.floor(i / ipw);
                    const posInWall = (i % ipw) - (ipw - 1) / 2;
                    let x=0, z=0, rot=0;
                    const coord = posInWall * PHOTO_SPACING;
                    if (wallIdx === 0) { x = coord; z = -OUTER_LIMIT + 0.05; rot = 0; }
                    else if (wallIdx === 1) { x = OUTER_LIMIT - 0.05; z = coord; rot = -Math.PI/2; }
                    else if (wallIdx === 2) { x = -coord; z = OUTER_LIMIT - 0.05; rot = Math.PI; }
                    else if (wallIdx === 3) { x = -OUTER_LIMIT + 0.05; z = -coord; rot = Math.PI/2; }
                    
                    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 3.5), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
                    mesh.position.set(x, 2.3, z); mesh.rotation.y = rot; scene.add(mesh);
                    // Ensure bounding box exists for frustum check
                    mesh.geometry.computeBoundingBox();
                    
                    const spot = new THREE.PointLight(0xffffff, 0, 10);
                    spot.position.set(x + Math.sin(rot)*2, 4, z + Math.cos(rot)*2); scene.add(spot);
                    artPieces.push({ file, mesh, light: spot, isLoaded: false });
                });

                const floor = new THREE.Mesh(new THREE.PlaneGeometry(wallLength*3, wallLength*3), new THREE.MeshStandardMaterial({ color: 0xeeeeee }));
                floor.rotation.x = -Math.PI/2; scene.add(floor);

                camera.position.set(0, 1.7, -OUTER_LIMIT + 4);
                status.innerText = "Photos randomized. Press Enter.";
                document.getElementById('start-btn').style.display = 'block';
                
            } catch (err) { status.innerText = "Error: " + err.message; }
        }

        // --- VISIBILITY UPDATER ---
        function updateVisibility() {
            // Update the Frustum based on current camera view
            projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            frustum.setFromMatrix(projScreenMatrix);

            artPieces.forEach(art => {
                // Check if the photo mesh is within the camera's view (Frustum)
                const isVisible = frustum.intersectsObject(art.mesh);

                if (isVisible && !art.isLoaded) {
                    art.isLoaded = true;
                    loader.load(art.file, (t) => { 
                        art.mesh.material.map = t; 
                        art.mesh.material.color.set(0xffffff);
                        art.mesh.material.needsUpdate = true; 
                        art.light.intensity = 8; 
                    });
                } else if (!isVisible && art.isLoaded) {
                    // Unload when it leaves the field of view to save memory
                    art.isLoaded = false; 
                    art.light.intensity = 0;
                    if(art.mesh.material.map) { 
                        art.mesh.material.map.dispose(); 
                        art.mesh.material.map = null; 
                        art.mesh.material.color.set(0xcccccc);
                        art.mesh.material.needsUpdate = true; 
                    }
                }
            });
        }

        // --- ENGINE ---
        function animate() {
            requestAnimationFrame(animate);
            if (isStarted) {
                if (moveState.f !== 0 || moveState.r !== 0) {
                    if (moveStartTime === null) moveStartTime = performance.now();
                    const mult = Math.min(3, 1 + ((performance.now() - moveStartTime)/2000)*2);
                    const speed = BASE_MOVE_SPEED * mult;
                    document.getElementById('speed-ui').innerText = `Speed: ${mult.toFixed(1)}x`;

                    const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
                    const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
                    const nextPos = camera.position.clone();
                    nextPos.addScaledVector(dir, moveState.f * speed);
                    nextPos.addScaledVector(side, -moveState.r * speed);

                    const absX = Math.abs(nextPos.x), absZ = Math.abs(nextPos.z);
                    const inRing = ((absX > INNER_LIMIT && absX < OUTER_LIMIT) || (absZ > INNER_LIMIT && absZ < OUTER_LIMIT)) && absX < OUTER_LIMIT + 0.1 && absZ < OUTER_LIMIT + 0.1;
                    const inWing = nextPos.x > OUTER_LIMIT && Math.abs(nextPos.z) < 1.8 && nextPos.x < OUTER_LIMIT + INFINITE_LEN;
                    
                    if (inRing || inWing) camera.position.copy(nextPos);
                }
                
                // ALWAYS update visibility so distance doesn't matter, only field of view
                updateVisibility();
            }
            renderer.render(scene, camera);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            isStarted = true;
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('speed-ui').style.display = 'block';
            if (!isMobile) controls.lock();
            else document.getElementById('joystick-wrapper').style.display = 'block';
        });

        window.addEventListener('keydown', (e) => { if (e.code === 'KeyW') moveState.f = 1; if (e.code === 'KeyS') moveState.f = -1; if (e.code === 'KeyA') moveState.r = -1; if (e.code === 'KeyD') moveState.r = 1; });
        window.addEventListener('keyup', (e) => { if (['KeyW', 'KeyS'].includes(e.code)) moveState.f = 0; if (['KeyA', 'KeyD'].includes(e.code)) moveState.r = 0; if (moveState.f === 0 && moveState.r === 0) moveStartTime = null; });
        
        let lx=null, ly=null, jA=false, jS={x:0,y:0};
        document.addEventListener('touchstart', (e) => { const t=e.touches[0]; if (t.clientX < 150) { jA=true; jS={x:t.clientX,y:t.clientY}; } else { lx=t.clientX; ly=t.clientY; } });
        document.addEventListener('touchmove', (e) => {
            const t = Array.from(e.touches).find(u => u.clientX > 150) || e.touches[0];
            if (jA && t.clientX < window.innerWidth/2) {
                moveState.f = -((t.clientY - jS.y)/40); moveState.r = (t.clientX - jS.x)/40;
                document.getElementById('joystick-knob').style.transform = `translate(${moveState.r*20}px, ${-moveState.f*20}px)`;
            } else if (lx !== null) {
                camera.rotation.y += (t.clientX - lx) * 0.007;
                camera.rotation.x += (t.clientY - ly) * 0.007;
                camera.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, camera.rotation.x));
                lx=t.clientX; ly=t.clientY;
            }
        });
        document.addEventListener('touchend', () => { jA=false; moveState.f=0; moveState.r=0; lx=null; ly=null; document.getElementById('joystick-knob').style.transform='translate(0,0)'; });
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

        loadGallery();
        animate();
    </script>
</body>
</html>
