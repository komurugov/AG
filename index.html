<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Gallery</title>
    <style>
        body { margin: 0; overflow: hidden; background: #ffffff; font-family: sans-serif; touch-action: none; }
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.9); padding: 30px; border-radius: 15px;
            text-align: center; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 80%; max-width: 300px;
        }
        #joystick-wrapper {
            position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px;
            background: rgba(0,0,0,0.05); border-radius: 50%; display: none; z-index: 20; border: 1px solid #ddd;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: #333; border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <h2>The Grand Gallery 0729</h2>
        <p>Click to Enter</p>
        <button style="padding: 10px 20px; cursor: pointer;">START</button>
    </div>
    <div id="joystick-wrapper"><div id="joystick-knob"></div></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- CONFIG ---
        const MOVE_SPEED = 0.06; 
        const GALLERY_SIZE = 15;
        const WALL_HEIGHT = 5;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        scene.fog = new THREE.Fog(0xffffff, 0, 45);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, 12); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(light);

        // --- CONTROLS ---
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const controls = new PointerLockControls(camera, document.body);
        const instructions = document.getElementById('instructions');

        instructions.addEventListener('click', () => {
            if (!isMobile) controls.lock();
            instructions.style.display = 'none';
            if (isMobile) document.getElementById('joystick-wrapper').style.display = 'block';
        });

        // --- ARCHITECTURE ---
        const loader = new THREE.TextureLoader();

        // FLOOR & GRID FIX:
        // We move the grid slightly UP (0.05) so it doesn't "flicker" or disappear into the floor (Z-Fighting)
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0xfafafa }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const grid = new THREE.GridHelper(100, 40, 0xdddddd, 0xeeeeee);
        grid.position.y = 0.05; // Slightly above floor
        scene.add(grid);

        // WALLS (Square Loop)
        function createWall(w, h, x, z, rot = 0) {
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            mesh.position.set(x, h/2, z);
            mesh.rotation.y = rot;
            scene.add(mesh);
        }
        // Outer
        createWall(GALLERY_SIZE*2+4, WALL_HEIGHT, 0, -GALLERY_SIZE-2);
        createWall(GALLERY_SIZE*2+4, WALL_HEIGHT, 0, GALLERY_SIZE+2);
        createWall(GALLERY_SIZE*2+4, WALL_HEIGHT, -GALLERY_SIZE-2, 0, Math.PI/2);
        createWall(GALLERY_SIZE*2+4, WALL_HEIGHT, GALLERY_SIZE+2, 0, -Math.PI/2);
        // Inner
        createWall(GALLERY_SIZE*2-4, WALL_HEIGHT, 0, -GALLERY_SIZE+2);
        createWall(GALLERY_SIZE*2-4, WALL_HEIGHT, 0, GALLERY_SIZE-2);
        createWall(GALLERY_SIZE*2-4, WALL_HEIGHT, -GALLERY_SIZE+2, 0, Math.PI/2);
        createWall(GALLERY_SIZE*2-4, WALL_HEIGHT, GALLERY_SIZE-2, 0, -Math.PI/2);

        // --- ART LOADING FIX ---
        function placeArt(file, x, z, rotationY) {
            // Check if it's a local file or a URL
            const path = file.startsWith('http') ? file : `./${file}`;
            
            loader.load(path, (texture) => {
                const artGeo = new THREE.PlaneGeometry(2.5, 3.5);
                const artMat = new THREE.MeshStandardMaterial({ map: texture });
                const mesh = new THREE.Mesh(artGeo, artMat);
                mesh.position.set(x, 2.3, z);
                mesh.rotation.y = rotationY;
                scene.add(mesh);

                // Frame
                const frame = new THREE.Mesh(new THREE.PlaneGeometry(2.7, 3.7), new THREE.MeshBasicMaterial({color: 0x000000}));
                frame.position.set(x, 2.3, z - 0.02);
                frame.rotation.y = rotationY;
                scene.add(frame);
            }, undefined, (err) => {
                console.error("Error loading image. Check filename case sensitivity!", err);
            });
        }

        // Place your photo on the NORTH wall of the corridor
        // Position: x=0, z=-16.9 (Corridor is between -17 and -13)
        placeArt('./20250914_160755.jpg', 0, -GALLERY_SIZE - 1.9, 0);

        // --- MOVEMENT ENGINE ---
        let moveState = { f: 0, r: 0 };
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveState.f = 1;
            if (e.code === 'KeyS') moveState.f = -1;
            if (e.code === 'KeyA') moveState.r = -1;
            if (e.code === 'KeyD') moveState.r = 1;
        });
        window.addEventListener('keyup', (e) => {
            if (['KeyW', 'KeyS'].includes(e.code)) moveState.f = 0;
            if (['KeyA', 'KeyD'].includes(e.code)) moveState.r = 0;
        });

        // Mobile Joystick
        let joystickActive = false;
        let joystickStart = { x: 0, y: 0 };
        document.addEventListener('touchstart', (e) => {
            if (e.touches[0].clientX < 150) {
                joystickActive = true;
                joystickStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
        document.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            const touch = e.touches[0];
            moveState.f = -((touch.clientY - joystickStart.y) / 40);
            moveState.r = (touch.clientX - joystickStart.x) / 40;
            document.getElementById('joystick-knob').style.transform = `translate(${moveState.r*20}px, ${-moveState.f*20}px)`;
        });
        document.addEventListener('touchend', () => {
            joystickActive = false;
            moveState = { f: 0, r: 0 };
            document.getElementById('joystick-knob').style.transform = `translate(0,0)`;
        });

        // Mobile Look (Swipe right half)
        let lastX = 0;
        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            if (touch.clientX > window.innerWidth/2 && !joystickActive) {
                if (lastX !== 0) camera.rotation.y -= (touch.clientX - lastX) * 0.01;
                lastX = touch.clientX;
            }
        });
        document.addEventListener('touchend', () => lastX = 0);

        function animate() {
            requestAnimationFrame(animate);
            if (moveState.f !== 0 || moveState.r !== 0) {
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0; dir.normalize();
                const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();

                const nextPos = camera.position.clone();
                nextPos.addScaledVector(dir, moveState.f * MOVE_SPEED);
                nextPos.addScaledVector(side, -moveState.r * MOVE_SPEED);

                const absX = Math.abs(nextPos.x);
                const absZ = Math.abs(nextPos.z);
                if (absX < GALLERY_SIZE + 1 && absZ < GALLERY_SIZE + 1 && (absX > GALLERY_SIZE - 1 || absZ > GALLERY_SIZE - 1)) {
                    camera.position.copy(nextPos);
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
