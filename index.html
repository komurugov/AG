<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Auto-Gallery</title>
    <style>
        body { margin: 0; overflow: hidden; background: #ffffff; font-family: sans-serif; touch-action: none; }
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95); padding: 30px; border-radius: 15px;
            text-align: center; z-index: 1000; box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
            width: 85%; max-width: 320px;
        }
        #joystick-wrapper {
            position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px;
            background: rgba(0,0,0,0.05); border-radius: 50%; display: none; z-index: 20; border: 1px solid #ddd;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: #333; border-radius: 50%;
        }
        #start-btn {
            display: none; margin-top: 20px; padding: 15px 30px; 
            background: #000; color: #fff; border: none; border-radius: 8px; 
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        #status-text { font-size: 14px; color: #444; }
    </style>
</head>
<body>
    <div id="instructions">
        <h2 style="margin-top:0">Art Gallery</h2>
        <p id="status-text">Connecting to GitHub...</p>
        <button id="start-btn">ENTER GALLERY</button>
    </div>

    <div id="joystick-wrapper"><div id="joystick-knob"></div></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- CONFIG ---
        const GITHUB_USERNAME = 'komurugov';
        const REPO_NAME = 'AG';
        const MOVE_SPEED = 0.06;
        const OFFSET = 16.98;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        scene.fog = new THREE.Fog(0xffffff, 0, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, -14.5); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));

        const loader = new THREE.TextureLoader();
        const controls = new PointerLockControls(camera, document.body);
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        // --- HIDE POPUP LOGIC ---
        const startBtn = document.getElementById('start-btn');
        const instructions = document.getElementById('instructions');

        startBtn.addEventListener('click', () => {
            console.log("Attempting to start...");
            
            // 1. Force hide the instructions
            instructions.style.display = 'none';
            
            // 2. Start controls
            if (!isMobile) {
                controls.lock();
            } else {
                document.getElementById('joystick-wrapper').style.display = 'block';
            }
        });

        // Re-show instructions if user exits (Desktop)
        controls.addEventListener('unlock', () => {
            instructions.style.display = 'block';
        });

        // --- IMAGE SCANNER ---
        async function scanImages() {
            const status = document.getElementById('status-text');
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/`);
                const data = await res.json();
                
                if (data.message && data.message.includes("API rate limit")) {
                    status.innerText = "GitHub Rate Limit reached. Try again in an hour.";
                    return;
                }

                const images = data
                    .filter(f => f.name.match(/\.(jpg|jpeg|png|webp)$/i))
                    .map(f => f.name);

                if (images.length > 0) {
                    status.innerText = `Loaded ${images.length} photos.`;
                    startBtn.style.display = 'inline-block';
                    buildGallery(images);
                } else {
                    status.innerText = "No .jpg files found in repo.";
                }
            } catch (e) {
                status.innerText = "Error connecting to GitHub.";
                console.error(e);
            }
        }

        function buildGallery(files) {
            files.forEach((file, i) => {
                let x = 0, z = 0, rot = 0;
                const spacing = 6;
                if (i < 5) { x = -12 + (i*spacing); z = -OFFSET; rot = 0; }
                else if (i < 10) { x = OFFSET; z = -12 + ((i-5)*spacing); rot = -Math.PI/2; }
                else if (i < 15) { x = 12 - ((i-10)*spacing); z = OFFSET; rot = Math.PI; }
                else if (i < 20) { x = -OFFSET; z = 12 - ((i-15)*spacing); rot = Math.PI/2; }
                
                loader.load(file, (texture) => {
                    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 3.8), new THREE.MeshStandardMaterial({ map: texture }));
                    mesh.position.set(x, 2.3, z);
                    mesh.rotation.y = rot;
                    scene.add(mesh);

                    const spot = new THREE.PointLight(0xffffff, 7, 12);
                    const lx = x + (rot === Math.PI/2 ? 1.5 : (rot === -Math.PI/2 ? -1.5 : 0));
                    const lz = z + (rot === 0 ? 1.5 : (rot === Math.PI ? -1.5 : 0));
                    spot.position.set(lx, 3.5, lz);
                    scene.add(spot);
                });
            });
        }

        // --- ENVIRONMENT ---
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0xfcfcfc }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);
        const grid = new THREE.GridHelper(100, 50, 0xcccccc, 0xeeeeee);
        grid.position.y = 0.02;
        scene.add(grid);

        function createWall(w, h, x, z, rot = 0) {
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            mesh.position.set(x, h/2, z); mesh.rotation.y = rot; scene.add(mesh);
        }
        createWall(40, 5, 0, -17); createWall(40, 5, 0, 17);
        createWall(40, 5, -17, 0, Math.PI/2); createWall(40, 5, 17, 0, -Math.PI/2);
        createWall(26, 5, 0, -13); createWall(26, 5, 0, 13);
        createWall(26, 5, -13, 0, Math.PI/2); createWall(26, 5, 13, 0, -Math.PI/2);

        // --- ENGINE ---
        let moveState = { f: 0, r: 0 };
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveState.f = 1; if (e.code === 'KeyS') moveState.f = -1;
            if (e.code === 'KeyA') moveState.r = -1; if (e.code === 'KeyD') moveState.r = 1;
        });
        window.addEventListener('keyup', (e) => {
            if (['KeyW', 'KeyS', 'KeyA', 'KeyD'].includes(e.code)) {
                if (['KeyW', 'KeyS'].includes(e.code)) moveState.f = 0;
                if (['KeyA', 'KeyD'].includes(e.code)) moveState.r = 0;
            }
        });

        // Touch Look
        let lastX = null;
        document.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            if (t.clientX > window.innerWidth/2 && !joystickActive) {
                if (lastX !== null) camera.rotation.y -= (t.clientX - lastX) * 0.008;
                lastX = t.clientX;
            }
        });
        document.addEventListener('touchend', () => { lastX = null; });

        // Joystick
        let joystickActive = false, joystickStart = { x: 0, y: 0 };
        document.addEventListener('touchstart', (e) => {
            if (e.touches[0].clientX < 150) {
                joystickActive = true;
                joystickStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
        document.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            const t = e.touches[0];
            moveState.f = -((t.clientY - joystickStart.y) / 40);
            moveState.r = (t.clientX - joystickStart.x) / 40;
            document.getElementById('joystick-knob').style.transform = `translate(${moveState.r*20}px, ${-moveState.f*20}px)`;
        });
        document.addEventListener('touchend', () => {
            joystickActive = false; moveState.f = 0; moveState.r = 0;
            document.getElementById('joystick-knob').style.transform = `translate(0,0)`;
        });

        function animate() {
            requestAnimationFrame(animate);
            if (moveState.f !== 0 || moveState.r !== 0) {
                const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
                const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
                const nextPos = camera.position.clone();
                nextPos.addScaledVector(dir, moveState.f * MOVE_SPEED);
                nextPos.addScaledVector(side, -moveState.r * MOVE_SPEED);
                const absX = Math.abs(nextPos.x), absZ = Math.abs(nextPos.z);
                if ((absX > 13.5 && absX < 16.5) || (absZ > 13.5 && absZ < 16.5)) {
                    if (absX < 16.5 && absZ < 16.5) camera.position.copy(nextPos);
                }
            }
            renderer.render(scene, camera);
        }

        scanImages();
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
