<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Auto-Gallery - Inversed & Vertical Look</title>
    <style>
        body { margin: 0; overflow: hidden; background: #ffffff; font-family: sans-serif; touch-action: none; }
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95); padding: 30px; border-radius: 15px;
            text-align: center; z-index: 1000; box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
            width: 85%; max-width: 320px;
        }
        #joystick-wrapper {
            position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px;
            background: rgba(0,0,0,0.05); border-radius: 50%; display: none; z-index: 20; border: 1px solid #ddd;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: #333; border-radius: 50%;
        }
        #start-btn { display: none; margin-top: 20px; padding: 15px 30px; background: #000; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="instructions">
        <h2 style="margin-top:0">Art Gallery</h2>
        <p id="status-text">Scanning for photos...</p>
        <button id="start-btn">ENTER</button>
    </div>
    <div id="joystick-wrapper"><div id="joystick-knob"></div></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- CONFIG ---
        const GITHUB_USERNAME = 'komurugov';
        const REPO_NAME = 'AG';
        const MOVE_SPEED = 0.07;
        const OUTER_WALL_DIST = 20; 
        const INNER_WALL_DIST = 12;
        const ART_Z_OFFSET = 19.95;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfafafa);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, -16); 
        
        // FIX: Set rotation order to YXZ (Y-axis rotation first) for proper FPS look
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));

        const loader = new THREE.TextureLoader();
        const controls = new PointerLockControls(camera, document.body);
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        // --- UI & START ---
        const startBtn = document.getElementById('start-btn');
        startBtn.addEventListener('click', () => {
            document.getElementById('instructions').style.display = 'none';
            if (!isMobile) controls.lock();
            else document.getElementById('joystick-wrapper').style.display = 'block';
        });

        // --- WALLS (DOUBLE SIDED) ---
        function createWall(w, h, x, z, rot = 0) {
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
            mesh.position.set(x, h/2, z);
            mesh.rotation.y = rot;
            scene.add(mesh);
        }
        createWall(44, 6, 0, -OUTER_WALL_DIST); createWall(44, 6, 0, OUTER_WALL_DIST);
        createWall(44, 6, -OUTER_WALL_DIST, 0, Math.PI/2); createWall(44, 6, OUTER_WALL_DIST, 0, -Math.PI/2);
        createWall(24, 6, 0, -INNER_WALL_DIST); createWall(24, 6, 0, INNER_WALL_DIST);
        createWall(24, 6, -INNER_WALL_DIST, 0, Math.PI/2); createWall(24, 6, INNER_WALL_DIST, 0, -Math.PI/2);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0xeeeeee }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // --- ART SCANNER ---
        async function scanImages() {
            const status = document.getElementById('status-text');
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/`);
                const data = await res.json();
                const images = data.filter(f => f.name.match(/\.(jpg|jpeg|png|webp)$/i)).map(f => f.name);

                if (images.length > 0) {
                    status.innerText = `Photos found: ${images.length}. Ready!`;
                    startBtn.style.display = 'inline-block';
                    images.forEach((file, i) => {
                        let x = 0, z = 0, rot = 0;
                        const spacing = 7;
                        if (i < 5) { x = -14 + (i*spacing); z = -ART_Z_OFFSET; rot = 0; }
                        else if (i < 10) { x = ART_Z_OFFSET; z = -14 + ((i-5)*spacing); rot = -Math.PI/2; }
                        else if (i < 15) { x = 14 - ((i-10)*spacing); z = ART_Z_OFFSET; rot = Math.PI; }
                        else if (i < 20) { x = -ART_Z_OFFSET; z = 14 - ((i-15)*spacing); rot = Math.PI/2; }
                        
                        loader.load(file, (texture) => {
                            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(3, 4), new THREE.MeshStandardMaterial({ map: texture }));
                            mesh.position.set(x, 2.5, z); mesh.rotation.y = rot; scene.add(mesh);
                            const spot = new THREE.PointLight(0xffffff, 8, 15);
                            const lx = x + (rot === Math.PI/2 ? 2 : (rot === -Math.PI/2 ? -2 : 0));
                            const lz = z + (rot === 0 ? 2 : (rot === Math.PI ? -2 : 0));
                            spot.position.set(lx, 4, lz); scene.add(spot);
                        });
                    });
                }
            } catch (e) { status.innerText = "Connection error."; }
        }

        // --- ENGINE ---
        let moveState = { f: 0, r: 0 };
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveState.f = 1; if (e.code === 'KeyS') moveState.f = -1;
            if (e.code === 'KeyA') moveState.r = -1; if (e.code === 'KeyD') moveState.r = 1;
        });
        window.addEventListener('keyup', (e) => {
            if (['KeyW', 'KeyS'].includes(e.code)) moveState.f = 0;
            if (['KeyA', 'KeyD'].includes(e.code)) moveState.r = 0;
        });

        // --- LOOK LOGIC (TOUCH) ---
        let joystickActive = false, joystickStart = { x: 0, y: 0 };
        let lastTouchX = null, lastTouchY = null;

        document.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            if (t.clientX < 150) {
                joystickActive = true;
                joystickStart = { x: t.clientX, y: t.clientY };
            } else {
                lastTouchX = t.clientX;
                lastTouchY = t.clientY;
            }
        });

        document.addEventListener('touchmove', (e) => {
            const t = Array.from(e.touches).find(touch => touch.clientX > 150) || e.touches[0];
            
            if (joystickActive && t.clientX < window.innerWidth / 2) {
                moveState.f = -((t.clientY - joystickStart.y) / 40);
                moveState.r = (t.clientX - joystickStart.x) / 40;
                document.getElementById('joystick-knob').style.transform = `translate(${moveState.r*20}px, ${-moveState.f*20}px)`;
            } else {
                // LOOK LOGIC
                if (lastTouchX !== null && lastTouchY !== null) {
                    const deltaX = t.clientX - lastTouchX;
                    const deltaY = t.clientY - lastTouchY;

                    // INVERSED HORIZONTAL: Dragging right (+deltaX) adds to rotation.y (looks left)
                    camera.rotation.y += deltaX * 0.006;
                    
                    // VERTICAL LOOK: Dragging down (+deltaY) adds to rotation.x (looks up)
                    camera.rotation.x += deltaY * 0.006;

                    // CLAMP VERTICAL: Limit to about 80 degrees up/down so we don't flip
                    camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
                }
                lastTouchX = t.clientX;
                lastTouchY = t.clientY;
            }
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (e.touches.length === 0) {
                joystickActive = false;
                moveState.f = 0; moveState.r = 0;
                lastTouchX = null; lastTouchY = null;
                document.getElementById('joystick-knob').style.transform = `translate(0,0)`;
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if (moveState.f !== 0 || moveState.r !== 0) {
                const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
                const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
                const nextPos = camera.position.clone();
                nextPos.addScaledVector(dir, moveState.f * MOVE_SPEED);
                nextPos.addScaledVector(side, -moveState.r * MOVE_SPEED);

                const absX = Math.abs(nextPos.x), absZ = Math.abs(nextPos.z);
                const isCorrectRing = (absX > 12.5 && absX < 19.5) || (absZ > 12.5 && absZ < 19.5);
                if (isCorrectRing && absX < 19.5 && absZ < 19.5) camera.position.copy(nextPos);
            }
            renderer.render(scene, camera);
        }

        scanImages(); animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
