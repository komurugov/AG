<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Gallery - Square Loop</title>
    <style>
        body { margin: 0; overflow: hidden; background: #ffffff; font-family: sans-serif; touch-action: none; }
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.9); padding: 30px; border-radius: 15px;
            text-align: center; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        #joystick-wrapper {
            position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px;
            background: rgba(0,0,0,0.05); border-radius: 50%; display: none; z-index: 20; border: 1px solid #ddd;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: #333; border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <h2>The Grand Gallery</h2>
        <p><b>Mobile:</b> Joystick (Left) | Swipe (Right)<br><b>Desktop:</b> WASD | Mouse Click</p>
        <button style="padding: 10px 20px; cursor: pointer;">ENTER</button>
    </div>
    
    <div id="joystick-wrapper"><div id="joystick-knob"></div></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- CONFIGURATION ---
        const MOVE_SPEED = 0.06; // Your requested speed
        const COLLISION_DISTANCE = 0.8;
        const GALLERY_SIZE = 15; // The size of the square loop
        const WALL_HEIGHT = 4;
        
        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfafafa);
        scene.fog = new THREE.Fog(0xfafafa, 0, 35);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, 12); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(light);

        // Spotlights for art
        function addSpotlight(x, z) {
            const spot = new THREE.PointLight(0xffffff, 15);
            spot.position.set(x, 3.5, z);
            scene.add(spot);
        }

        // --- CONTROLS ---
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const instructions = document.getElementById('instructions');
        const controls = new PointerLockControls(camera, document.body);

        if (isMobile) {
            document.getElementById('joystick-wrapper').style.display = 'block';
            instructions.addEventListener('touchstart', () => instructions.style.display = 'none');
        } else {
            instructions.addEventListener('click', () => controls.lock());
            controls.addEventListener('lock', () => instructions.style.display = 'none');
            controls.addEventListener('unlock', () => instructions.style.display = 'block');
        }

        // --- ARCHITECTURE (SQUARE LOOP) ---
        const loader = new THREE.TextureLoader();
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0 });

        // Floor
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Building the square loop walls
        // Outer Walls
        createWall(GALLERY_SIZE*2, WALL_HEIGHT, 0, -GALLERY_SIZE); // North
        createWall(GALLERY_SIZE*2, WALL_HEIGHT, 0, GALLERY_SIZE);  // South
        createWall(GALLERY_SIZE*2, WALL_HEIGHT, -GALLERY_SIZE, 0, Math.PI/2); // West
        createWall(GALLERY_SIZE*2, WALL_HEIGHT, GALLERY_SIZE, 0, -Math.PI/2); // East

        // Inner Walls (Creating the "Loop" corridor)
        const INNER = GALLERY_SIZE - 5;
        createWall(INNER*2, WALL_HEIGHT, 0, -INNER);
        createWall(INNER*2, WALL_HEIGHT, 0, INNER);
        createWall(INNER*2, WALL_HEIGHT, -INNER, 0, Math.PI/2);
        createWall(INNER*2, WALL_HEIGHT, INNER, 0, -Math.PI/2);

        function createWall(w, h, x, z, rot = 0) {
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
            mesh.position.set(x, h/2, z);
            mesh.rotation.y = rot;
            scene.add(mesh);
        }

        // --- PLACING YOUR PHOTO ---
        // I will use a high-quality placeholder, replace with your photo link
        const photoUrl = 'https://i.imgur.com/your_provided_image_url_here.jpg'; 
        
        function placeArt(imageUrl, x, z, rotationY) {
            const texture = loader.load(imageUrl);
            // Frame aspect ratio (Matches your portrait photo roughly)
            const artGeo = new THREE.PlaneGeometry(2.2, 3);
            const artMat = new THREE.MeshStandardMaterial({ map: texture });
            const mesh = new THREE.Mesh(artGeo, artMat);
            mesh.position.set(x, 2, z);
            mesh.rotation.y = rotationY;
            scene.add(mesh);

            // Black border
            const frame = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 3.2), new THREE.MeshBasicMaterial({color: 0x111111}));
            frame.position.set(x, 2, z - 0.02);
            frame.rotation.y = rotationY;
            scene.add(frame);
            
            addSpotlight(x, z + (rotationY === 0 ? 2 : -2));
        }

        // Place your photo on the first wall you see
        placeArt('https://i.ibb.co/n8n59M85/20250914-160755.jpg', 0, -GALLERY_SIZE + 0.1, 0); 
        // TIP: To use your actual image, upload it to Imgur or GitHub and paste the "Direct Link" above.

        // --- MOVEMENT & COLLISION ---
        let moveState = { f: 0, r: 0 };
        
        // Mobile Joystick logic (Previous version included)
        // [Joystick code here... simplified for brevity]
        let joystickActive = false;
        let joystickStart = { x: 0, y: 0 };
        document.addEventListener('touchstart', (e) => {
            if (e.touches[0].clientX < 150) {
                joystickActive = true;
                joystickStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
        document.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            const touch = e.touches[0];
            moveState.f = -((touch.clientY - joystickStart.y) / 50);
            moveState.r = (touch.clientX - joystickStart.x) / 50;
            document.getElementById('joystick-knob').style.transform = `translate(${moveState.r*20}px, ${-moveState.f*20}px)`;
        });
        document.addEventListener('touchend', () => {
            joystickActive = false;
            moveState = { f: 0, r: 0 };
            document.getElementById('joystick-knob').style.transform = `translate(0,0)`;
        });

        // Desktop keys
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveState.f = 1;
            if (e.code === 'KeyS') moveState.f = -1;
            if (e.code === 'KeyA') moveState.r = -1;
            if (e.code === 'KeyD') moveState.r = 1;
        });
        window.addEventListener('keyup', (e) => {
            if (['KeyW', 'KeyS'].includes(e.code)) moveState.f = 0;
            if (['KeyA', 'KeyD'].includes(e.code)) moveState.r = 0;
        });

        function animate() {
            requestAnimationFrame(animate);
            
            if (moveState.f !== 0 || moveState.r !== 0) {
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0; dir.normalize();
                const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();

                const nextPos = camera.position.clone();
                nextPos.addScaledVector(dir, moveState.f * MOVE_SPEED);
                nextPos.addScaledVector(side, -moveState.r * MOVE_SPEED);

                // COLLISION: Keep camera inside the hallway
                const dist = Math.max(Math.abs(nextPos.x), Math.abs(nextPos.z));
                if (dist < GALLERY_SIZE - 0.5 && dist > INNER + 0.5) {
                    camera.position.copy(nextPos);
                }
            }
            renderer.render(scene, camera);
        }
            // Mobile Look (Right side)
        let lastX = 0;
        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            if (touch.clientX > window.innerWidth/2 && !joystickActive) {
                if (lastX !== 0) camera.rotation.y -= (touch.clientX - lastX) * 0.01;
                lastX = touch.clientX;
            }
        });
        document.addEventListener('touchend', () => lastX = 0);

        animate();
    </script>
</body>
</html>
